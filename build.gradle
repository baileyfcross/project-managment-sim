plugins {
    id 'java'
    id 'application'
}

group = 'edu.simulator'
version = '1.0.0'

ext {
    platform = System.getProperty('os.name').toLowerCase().contains('win') ? 'win' :
            System.getProperty('os.name').toLowerCase().contains('mac') ? 'mac' :
            'linux'
    javafxVersion = '21.0.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.openjfx:javafx-base:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-web:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-media:${javafxVersion}:${platform}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'edu.simulator.App'
}

def javafxRuntimeModules = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') }
tasks.named('run', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath - javafxRuntimeModules
    jvmArgs '--module-path', javafxRuntimeModules.asPath,
            '--add-modules', 'javafx.controls,javafx.web,javafx.media',
            "-Dsimulator.version=${project.version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def npmCommand = isWindows ? ['cmd', '/c', 'npm.cmd'] : ['npm']

tasks.register('installFrontend', Exec) {
    workingDir = file('frontend')
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.file(file('frontend/node_modules/.package-lock.json'))
    commandLine = npmCommand + ['ci']
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'installFrontend'
    workingDir = file('frontend')
    inputs.files(fileTree('frontend') {
        exclude 'node_modules/**'
    })
    outputs.dir(file('src/main/resources/web'))
    commandLine = npmCommand + ['run', 'build']
}

processResources {
    dependsOn 'buildFrontend'
}

tasks.register('packageApp') {
    dependsOn 'installDist'
    inputs.files(configurations.runtimeClasspath)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.dir(layout.buildDirectory.dir('package/windows'))

    doLast {
        if (!isWindows) {
            throw new GradleException('The packageApp task currently builds a Windows application image only.')
        }
        def packageDirectory = layout.buildDirectory.dir('package/windows').get().asFile
        def applicationImage = new File(packageDirectory, 'SoftwareProjectManagementSimulator')
        project.delete(applicationImage)
        packageDirectory.mkdirs()

        def installationDirectory = layout.buildDirectory
                .dir("install/${application.applicationName}/lib").get().asFile
        def mainJar = tasks.named('jar').get().archiveFile.get().asFile
        def javaHome = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().metadata.installationPath.asFile
        def jpackageExecutable = new File(javaHome, 'bin/jpackage.exe')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("jpackage was not found in the selected Java 21 JDK: ${jpackageExecutable}")
        }
        if (!mainJar.isFile() || !installationDirectory.isDirectory()) {
            throw new GradleException('The application distribution is incomplete; run the Gradle build first.')
        }

        exec {
            executable jpackageExecutable.absolutePath
            args '--type', 'app-image',
                    '--input', installationDirectory.absolutePath,
                    '--dest', packageDirectory.absolutePath,
                    '--name', 'SoftwareProjectManagementSimulator',
                    '--app-version', project.version.toString(),
                    '--vendor', 'Software Project Management Simulator',
                    '--main-jar', mainJar.name,
                    '--main-class', 'edu.simulator.App',
                    '--module-path', javafxRuntimeModules.asPath,
                    '--add-modules', 'javafx.controls,javafx.web,javafx.media',
                    '--java-options', '--add-modules=javafx.controls,javafx.web,javafx.media',
                    '--java-options', "-Dsimulator.version=${project.version}"
        }
    }
}
